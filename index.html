<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Document</title>
</head>
<body>
    <main class="app">
        <h1>Bid App</h1>
        <div class="bid-history">
            <h2>Bid History</h2>
            <ul id="bid-history">
                <li></li>
            </ul>
        </div>

        <!-- Inputs -->
        <div class="bids">
            <div>
                <label>Bidder 1 </label>
                <input id="bidder1-input" type="number"/>
                <button type="button" id="bidder1-button">Place Bid</button>
            
            </div>
            <div>
                <label>Bidder 2 </label>
                <input id="bidder2-input" type="number"/>
                <button type="button" id="bidder2-button">Place Bid</button>
            </div>
            <button type="button" id="bids-clear">Clear Bids</button>
        </div>

        <!-- HIghest Bidder -->
         <h2>Highest Bidder</h2>
         <div id="highest-bid">No bids yet</div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
